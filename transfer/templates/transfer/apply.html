{% extends "base.html" %}

{% block title %}轉社申請{% endblock %}

{% block main %}
        <h1>轉社申請</h1>
    {% if error %}
        <p style="color:rgb(152, 37, 37);">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div>
            <label>原社團：</label>
            {% if current_club %}
                <span style="font-weight: bold; color: #0056b3;">{{ current_club.name }}</span>
            {% else %}
                <span style="color: red;">無所屬社團（無法申請）</span>
            {% endif %}
        </div>
        <div>
            <label for="new_club">想轉的新社團：</label>
            <select id="new_club" name="new_club" required> #必填，確保用戶選擇一個新社團
                <option value="">選擇新社團</option>
                {% for club in clubs %}
                    {% if club != current_club %} #過濾掉原社團，避免申請轉到同一個社團
                        <option value="{{ club.id }}">{{ club.name }}</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>
        <button type="submit" {% if not current_club %}disabled{% endif %}>送出申請</button>#如果沒有原社團，就禁用提交按鈕，避免無效申請
    </form>
    <p>💥已經申請了嗎？</p>
    <p><a href="{% url 'progress' %}">查看我的進度</a></p>
{% endblock %}
