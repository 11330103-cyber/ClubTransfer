<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="Asia/Taipei">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轉社申請</title>
</head>
<body>
    <h1>轉社申請</h1>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div>
            <label for="old_club">原社團：</label>
            <select id="old_club" name="old_club">
                <option value="">選擇舊社團</option>
                {% for club in clubs %}
                    <option value="{{ club.id }}">{{ club.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="new_club">想轉的新社團：</label>
            <select id="new_club" name="new_club">
                <option value="">選擇新社團</option>
                {% for club in clubs %}
                    <option value="{{ club.id }}">{{ club.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit">送出申請</button>
    </form>
    <p>💥已經申請了嗎？</p>
    <p><a href="{% url 'progress' %}">查看轉社的進度</a></p>
</body>
</html>
