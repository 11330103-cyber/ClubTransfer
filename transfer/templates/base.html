{% load static %}
<!DOCTYPE html>
<html lang="zn-hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Document{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <nav class="toolbar">
        <div class="toolbar-logo" href="{% url 'index' %}">
            <h3><strong>大直高中轉社系統🥴</strong></h3>
            <p style="font-size: 10px;">由李芸萱、柯景允設計</p>
        </div>
        <div class="toolbar-menu">
            <button id="theme-toggle" class="bot toolbar-item">切換顏色模式</button>
            <a class="toolbar-item" href="{% url 'index' %}"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" alt="Menu Icon" style="width:24px; height:24px;">首頁</a>
            <a class="toolbar-item" href="{% url 'club_detail' %}">社團詳細資訊</a>
            {% if not user.is_authenticated %}
                <a class="toolbar-item" href="{% url 'login' %}">登入</a>
            {% else %}
                {% if user.is_superuser or user.is_staff %}
                    <a class="toolbar-item" href="{% url 'setting' %}">設定</a>
                {% endif %}
                <form class="toolbar-item" action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="toolbar-item" style="background:none;border:none;padding:0;">{{ user }}登出</button>
                </form>
            {% endif %}
        </div>
    </nav>

    <script>
    const toggleBtn = document.getElementById('theme-toggle');
    
    
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }

    
    toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        
        //瀏覽器紀錄:P
        if (document.body.classList.contains('dark-mode')) {
            localStorage.setItem('theme', 'dark');
        } else {
            localStorage.setItem('theme', 'light');
        }
    });
</script>
    {% block main %}{% endblock %}
</body>
</html>
